name: tmp build hostinger
on:
  push:
    branches: [tmp-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: build hostinger
        run: npm run build && mkdir -p out && mv dist out/hostinger
        env:
          BASE_PATH: /
      - name: build preview
        run: npm run build && mv dist out/preview
        env:
          BASE_PATH: ./
      - name: typecheck (relatório)
        run: npx tsc --noEmit > out/_typecheck.txt 2>&1 || true
      - name: push out
        run: |
          cd out
          git init -q -b tmp-dist
          git config user.name ci; git config user.email ci@local
          git add -A; git commit -qm dist
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-dist
