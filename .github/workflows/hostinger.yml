name: Publicar na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /

      # Cópia do site pronto para baixar em Actions → (execução) → Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: site-pronto
          path: dist

      # Só envia quando os segredos de FTP estiverem cadastrados
      - name: Enviar para a Hostinger (FTP)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
